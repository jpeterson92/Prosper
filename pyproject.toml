[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "prosper-local"
version = "0.0.0"
description = "Local synthetic development foundation for Prosper"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "uv==0.13.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prosper"]

[tool.uv]
required-version = "==0.13.5"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/prosper/**/*.py" },
    { file = "src/prosper/py.typed" },
]
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "trove-classifiers==2026.9.21.13",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
show_error_codes = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
